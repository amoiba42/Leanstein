[project]
name = "prl"
version = "1.0.0"
description = "Prove Less, Repair Better: automation-friendly program repair for small models in Lean 4"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "nvidia-ml-py>=12.535",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "pytest-timeout>=2.3"]

[project.scripts]
prl = "prl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prl"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "lean: needs the pinned Lean toolchain (slow)",
  "llm: needs LM Studio with a model loaded",
]
